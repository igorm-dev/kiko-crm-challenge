services:
    postgres:
        image: postgres:16-alpine
        container_name: kiko-crm-postgres
        restart: unless-stopped
        environment:
            POSTGRES_USER: kiko
            POSTGRES_PASSWORD: kiko
            POSTGRES_DB: kiko_crm
        ports:
            # 5433 on the host so a locally installed Postgres on 5432 doesn't clash.
            # Override with POSTGRES_PORT in a root .env if 5433 is taken too.
            - '${POSTGRES_PORT:-5433}:5432'
        volumes:
            - postgres-data:/var/lib/postgresql/data
        healthcheck:
            test: ['CMD-SHELL', 'pg_isready -U kiko -d kiko_crm']
            interval: 5s
            timeout: 5s
            retries: 10

volumes:
    postgres-data:
